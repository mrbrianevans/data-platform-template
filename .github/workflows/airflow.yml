name: airflow

on:
  pull_request:
    paths: ["airflow/**", ".github/workflows/airflow.yml"]
  push:
    branches: [master]
    paths: ["airflow/**"]

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: airflow
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
