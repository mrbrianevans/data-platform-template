[project]
name = "airflow-dags"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "apache-airflow>=3.3.2",
    "apache-airflow-providers-google>=22.6.0",
    "duckdb>=1.5.6",
    "pyarrow>=26.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]

[tool.uv]
package = false

[tool.ruff]
src = ["dags"]
