[project]
name = "airflow-dags"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "apache-airflow>=3.3.2",
    "apache-airflow-providers-google>=22.6.0",
    "duckdb>=1.5.6",
    "pyarrow>=26.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]

[project.scripts]
# uv's own `uv format` command is experimental and pulls a separate ruff, so
# format through the project dependency instead.
format = "ruff:format_cli"

[tool.uv]
package = false

[tool.ruff]
src = ["dags"]
line-length = 110

[tool.ruff.lint]
# Airflow's own ruleset (task variable name must match task_id, etc.).
extend-select = ["AIR"]
